name: Build dylib

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Linux runners are always available; macOS runners can queue for a long time.
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl zip git libxml2 xz-utils
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Install Theos, iOS toolchain and SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls "$THEOS/toolchain" "$THEOS/sdks"

      - name: Build
        run: make -j"$(nproc)" FINALPACKAGE=1 messages=yes

      - name: Collect dylib
        run: |
          mkdir -p out
          SRC="$(find .theos/obj -name 'Shabah.dylib' -not -path '*/arm64/*' | head -1)"
          [ -n "$SRC" ] || SRC="$(find .theos/obj -name 'Shabah.dylib' | head -1)"
          cp "$SRC" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Shabah-dylib
          path: out/Shabah.dylib
