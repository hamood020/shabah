name: Build dylib

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: gmake -j"$(sysctl -n hw.ncpu)" FINALPACKAGE=1

      - name: Collect dylib
        run: |
          mkdir -p out
          SRC="$(find .theos/obj -name 'Shabah.dylib' -not -path '*/arm64/*' | head -1)"
          [ -n "$SRC" ] || SRC="$(find .theos/obj -name 'Shabah.dylib' | head -1)"
          cp "$SRC" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Shabah-dylib
          path: out/Shabah.dylib
